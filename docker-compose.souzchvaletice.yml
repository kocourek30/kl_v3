x-docker-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    container_name: souzchvaletice_db
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: repo-web:latest
    container_name: souzchvaletice_web
    logging: *default-logging
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate
      && python manage.py collectstatic --noinput
      && gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 kliknijidlo.wsgi:application"
    env_file:
      - .env.prod
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - logs_data:/app/logs

  rfid:
    image: ${RFID_IMAGE:-souzchvaletice-rfid:latest}
    container_name: souzchvaletice_rfid
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      RFID_BRIDGE_PORT: 3001
    volumes:
      - logs_data:/app/logs
    devices:
      - "${RFID_SERIAL_DEVICE:-/dev/null}:${RFID_SERIAL_DEVICE:-/dev/null}"
  nginx:
    image: nginx:1.27-alpine
    container_name: souzchvaletice_nginx
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - web
      - rfid
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/souzchvaletice_tunnel.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

volumes:
  postgres_data:
  media_data:
  static_data:
  logs_data:
