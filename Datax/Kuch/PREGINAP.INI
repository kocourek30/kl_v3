popis:
na prvnim radku je cesta k grouteru
na druhem postupne cisla A, B, C

A - prvni cislo
B - druhe cislo
C - treti cislo
P - pocet radku v souboru v prvnim parametru (.cfg) - cte se automaticky

vysledny cas:
a) pro prikaz Y na prvnim radku v cfg: T = C
b) ve vsech ostatnich pripadech: T = P x B + A
