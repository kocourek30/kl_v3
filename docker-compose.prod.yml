services:
  db:
    image: postgres:16-alpine
    container_name: kliknijidlo_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: kliknijidlo_web_prod
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate
      && python manage.py collectstatic --noinput
      && gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 kliknijidlo.wsgi:application"
    env_file:
      - .env.prod
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data_prod:/app/media
      - static_data_prod:/app/staticfiles
      - logs_data_prod:/app/logs

  rfid:
    build:
      context: .
      dockerfile: Dockerfile.rfid
    container_name: kliknijidlo_rfid_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      RFID_BRIDGE_PORT: 3001
    profiles: ["rfid"]
    volumes:
      - logs_data_prod:/app/logs
    devices:
      - "${RFID_SERIAL_DEVICE:-/dev/null}:${RFID_SERIAL_DEVICE:-/dev/null}"

  nginx:
    image: nginx:1.27-alpine
    container_name: kliknijidlo_nginx_prod
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/jidelna.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data_prod:/app/staticfiles:ro
      - media_data_prod:/app/media:ro
      - ${SSL_CERT_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro

volumes:
  postgres_data_prod:
  media_data_prod:
  static_data_prod:
  logs_data_prod:
