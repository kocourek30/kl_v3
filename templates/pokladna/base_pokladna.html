{% load static %}

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Pokladna – KlikniJídlo{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    :root {
      --primary-color: #54ae43;
      --accent-color: #f28f28;
    }

    body {
      background-color: #f5f7fa;
    }

    .pk-navbar {
      background-color: var(--primary-color);
      box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.18);
    }

    .pk-navbar .navbar-brand img {
      height: 44px;
      max-width: 150px;
    }

    .pk-navbar .navbar-text {
      font-size: 0.9rem;
    }

    .pk-main-wrapper {
      padding-inline: 1rem;
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    @media (min-width: 992px) {
      .pk-main-wrapper {
        padding-inline: 2rem;
      }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark pk-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="{% static 'images/logo-white.png' %}" alt="KlikniJídlo pokladna">
      <span class="ms-2 fw-semibold d-none d-sm-inline">Pokladna</span>
    </a>

    <div class="ms-auto text-white navbar-text">
      <i class="fas fa-user me-1"></i>
      Přihlášen:
      <strong>{{ request.user.get_full_name|default:request.user.username }}</strong>
    </div>
  </div>
</nav>

<main class="container-fluid pk-main-wrapper">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
