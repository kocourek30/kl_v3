{% load static %}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Povinná změna hesla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #eef4f8 0%, #f9fbfc 100%);
            min-height: 100vh;
        }
        .change-card {
            max-width: 520px;
            margin: 8vh auto;
            border: 1px solid #d6e2d9;
            border-radius: 18px;
            box-shadow: 0 16px 30px rgba(16, 24, 40, 0.08);
            overflow: hidden;
        }
        .change-card-header {
            background: #54ae43;
            color: #fff;
            padding: 1rem 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .btn-primary {
            background: #54ae43;
            border-color: #54ae43;
        }
        .btn-primary:hover {
            background: #429734;
            border-color: #429734;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card change-card">
        <div class="change-card-header">První přihlášení - změna hesla</div>
        <div class="card-body p-4">
            <p class="text-muted mb-4">
                Z bezpečnostních důvodů je potřeba nastavit nové heslo, než bude možné pokračovat.
            </p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}success{% endif %}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label for="new_password1" class="form-label">Nové heslo</label>
                    <input type="password" class="form-control" id="new_password1" name="new_password1" required>
                </div>
                <div class="mb-3">
                    <label for="new_password2" class="form-label">Nové heslo znovu</label>
                    <input type="password" class="form-control" id="new_password2" name="new_password2" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Uložit nové heslo</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
